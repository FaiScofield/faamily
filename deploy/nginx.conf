# Faamily — Nginx front end
#
# Serves the web UI (static bundle) and proxies API calls to the backend.
# Because both live behind one origin, the browser never issues a
# cross-origin request and CORS is not needed.

upstream faamily_backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Uploaded files can be up to 20MB; leave headroom for multipart overhead.
    client_max_body_size 25m;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml application/xml+rss text/javascript
               image/svg+xml;

    # --- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://faamily_backend/v1/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket / streaming support
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Streaming endpoints (e.g. SSE) must not be buffered
        proxy_buffering off;
    }

    # --- Health check (no auth, no rate-limit bucket) -----------------------
    location = /health {
        proxy_pass http://faamily_backend/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- Static web UI ------------------------------------------------------
    location / {
        root /usr/share/nginx/html;
        index index.html;

        # Hashed asset filenames under /assets/ are immutable
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # index.html must never be cached, otherwise clients keep loading an
        # old bundle that references deleted asset hashes.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Single-page app: unknown paths fall back to the app shell
        try_files $uri $uri/ /index.html;
    }
}
