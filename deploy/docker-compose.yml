# Faamily — NAS deployment stack
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# Services:
#   db       PostgreSQL 16 (data persisted in a named volume)
#   backend  FastAPI (built from ../Dockerfile)
#   nginx    Serves the web UI and proxies /api to the backend
#
# The stack is designed to run on a home NAS (Synology / QNAP / fnOS / plain
# Linux with Docker). Put a reverse proxy or a tunnel client in front of the
# nginx service to expose it to the internet — see docs/deployment-plan.md.

name: faamily

services:
  db:
    image: postgres:16-alpine
    container_name: faamily-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-family_butler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-family_butler}
      # Keeps initdb deterministic regardless of the host locale
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: Asia/Shanghai
    volumes:
      - db-data:/var/lib/postgresql/data
    # Not published to the host: only the backend needs to reach it.
    networks:
      - faamily
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-family_butler} -d ${POSTGRES_DB:-family_butler}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # One-shot: applies Alembic migrations before the backend serves traffic.
  # Without this the backend starts against an empty schema and every
  # endpoint fails. `restart: "no"` keeps it from looping.
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    image: faamily-backend:latest
    container_name: faamily-migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-family_butler}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-family_butler}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in deploy/.env}
      TZ: Asia/Shanghai
    command: ["alembic", "upgrade", "head"]
    networks:
      - faamily
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    image: faamily-backend:latest
    container_name: faamily-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-family_butler}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-family_butler}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in deploy/.env}
      JWT_ACCESS_TOKEN_EXPIRES_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRES_MINUTES:-30}
      JWT_REFRESH_TOKEN_EXPIRES_DAYS: ${JWT_REFRESH_TOKEN_EXPIRES_DAYS:-30}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      ONLINE_TIMEOUT_MINUTES: ${ONLINE_TIMEOUT_MINUTES:-15}
      # Nginx runs one hop in front of the backend
      TRUSTED_PROXY_HOPS: "1"
      # Same-origin deployment (web UI served by the same nginx) needs no CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # WeChat / SMTP are optional at this stage
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      TZ: Asia/Shanghai
    volumes:
      # Uploaded files live outside the container so they survive rebuilds
      - app-data:/app/data
    # Not published: nginx is the only entry point
    networks:
      - faamily
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: faamily-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Host port 8080 -> container 80.
      #
      # LAN-only usage (family members on the same WiFi): no tunnel needed.
      #   http://<nas-lan-ip>:8080/
      # The web UI and the API share this origin, so the browser sees a
      # same-origin request — no CORS, no mixed-content, no local-network
      # permission prompt.
      #
      # To also reach it from outside the home network, point an HTTPS
      # tunnel (cpolar / frp / Cloudflare Tunnel) at this port.
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Web UI build output. Two options:
      #   1) bind-mount the host directory holding the compiled Vite bundle
      #      (./web-dist on the NAS) — replace this line with:
      #        - ./web-dist:/usr/share/nginx/html:ro
      #   2) keep the named volume below and populate it with:
      #        docker cp web/dist/. faamily-nginx:/usr/share/nginx/html
      # The named volume is the default because an empty bind-mount source
      # would otherwise create a directory and Nginx would serve nothing.
      - web-dist:/usr/share/nginx/html:ro
    networks:
      - faamily
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db-data:
  app-data:
  web-dist:

networks:
  faamily:
    driver: bridge
    ipam:
      config:
        # Fixed subnet so the backend can scope --forwarded-allow-ips
        - subnet: 172.28.0.0/16
